name: Publish reviewed package
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish this reviewed commit to npm
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm publish --provenance --access public
